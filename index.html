<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sora House — App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6F0E7;
    --espresso:#5A4634;
    --taupe:#A8876A;
    --gold:#B08D57;
    --terracotta:#C46A45;
    --charcoal:#2E2620;
    --sand:#EFE6D8;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',sans-serif;
    background:radial-gradient(circle at 25% 15%, #f2e9db 0%, #e9ddc9 55%, #ddceb3 100%);
    color:var(--espresso);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    padding:36px 16px;
    overflow-x:hidden;
  }
  button{ font-family:inherit; cursor:pointer; background:none; }
  input,select,textarea{ font-family:inherit; }
  a{ color:inherit; }

  .stage-caption{
    font:700 11px 'Inter',sans-serif;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#8a7358;
    text-align:center;
  }

  .phone-frame{
    width:min(390px,90vw);
    height:min(844px,86vh);
    background:linear-gradient(160deg,#1f1a15,var(--charcoal) 40%,#241d17);
    border-radius:54px;
    padding:14px;
    box-shadow:0 50px 90px -25px rgba(46,38,32,.55), 0 0 0 2px rgba(176,141,87,.18), inset 0 0 0 1px rgba(255,255,255,.03);
    position:relative;
    flex-shrink:0;
  }
  .phone-screen{
    position:relative;
    width:100%;
    height:100%;
    background:var(--ivory);
    border-radius:40px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute;
    top:10px; left:50%; transform:translateX(-50%);
    width:120px; height:26px;
    background:var(--charcoal);
    border-radius:16px;
    z-index:30;
  }

  .status-bar{
    flex-shrink:0;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    font:600 14px 'Inter',sans-serif;
    color:var(--espresso);
    position:relative;
    z-index:20;
  }
  .status-icons{ display:flex; align-items:center; gap:6px; }
  .status-icons svg{ display:block; }

  .screen-content{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:4px 22px 110px;
    position:relative;
  }
  .screen-content::-webkit-scrollbar{ width:0; }
  .fade-in{ animation:fadeIn .28s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0 18px;
    gap:10px;
  }
  .header-left{ display:flex; align-items:center; gap:12px; }
  .eyebrow{
    font:700 10.5px 'Inter',sans-serif;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:3px;
  }
  .header-title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:22px;
    color:var(--espresso);
    line-height:1.15;
  }
  .header-sub{ font:400 13px 'Inter',sans-serif; color:var(--taupe); margin-top:4px; }

  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--sand);
    display:flex; align-items:center; justify-content:center;
    color:var(--espresso);
    flex-shrink:0;
    position:relative;
    transition:transform .15s ease;
  }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn .dot{
    position:absolute; top:6px; right:7px;
    width:8px; height:8px; border-radius:50%;
    background:var(--terracotta);
    border:1.5px solid var(--ivory);
  }
  .btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--terracotta); outline-offset:2px;
  }

  /* ---------- Tab bar ---------- */
  .tab-bar{
    flex-shrink:0;
    height:82px;
    background:var(--charcoal);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding-bottom:16px;
    position:relative;
    z-index:20;
  }
  .tab-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:rgba(246,240,231,.5);
    font:600 10.5px 'Inter',sans-serif;
    letter-spacing:.02em;
    transition:color .2s ease;
    padding:6px 10px;
  }
  .tab-item svg{ width:22px; height:22px; }
  .tab-item.active{ color:var(--gold); }

  /* ---------- Buttons ---------- */
  .btn{
    font:600 15px 'Inter',sans-serif;
    border-radius:14px;
    padding:14px 20px;
    border:none;
    transition:transform .15s ease, opacity .15s ease, background .2s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--terracotta); color:var(--ivory); }
  .btn-dark{ background:var(--charcoal); color:var(--ivory); }
  .btn-outline{ background:transparent; color:var(--espresso); border:1.5px solid rgba(90,70,52,.3); }
  .btn-outline-light{ background:transparent; color:var(--ivory); border:1.5px solid rgba(246,240,231,.4); }
  .btn-ghost{ background:rgba(90,70,52,.08); color:var(--espresso); }
  .btn-danger-ghost{ background:rgba(196,106,69,.1); color:var(--terracotta); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:10px 16px; font-size:13px; border-radius:11px; }
  .btn[disabled]{ opacity:.45; pointer-events:none; }
  .link-btn{ font:600 13px 'Inter',sans-serif; color:var(--terracotta); text-decoration:underline; text-underline-offset:3px; }

  /* ---------- Cards ---------- */
  .card{
    background:var(--sand);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    border:1px solid rgba(90,70,52,.06);
  }
  .section-title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:17px;
    color:var(--espresso);
    margin:22px 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title:first-child{ margin-top:2px; }

  .empty-state{
    text-align:center;
    padding:34px 18px;
    color:var(--taupe);
  }
  .empty-state svg{ color:var(--taupe); opacity:.6; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; margin-top:6px; line-height:1.5; }

  /* Ticket card */
  .ticket-card{
    background:var(--sand);
    border-radius:18px;
    padding:18px 22px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(90,70,52,.06);
  }
  .ticket-tag{
    display:inline-block;
    font:700 10px 'Inter',sans-serif;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ivory);
    background:var(--terracotta);
    padding:4px 9px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .ticket-name{ font-family:'Playfair Display',serif; font-weight:600; font-size:18px; color:var(--espresso); }
  .ticket-meta{ font:400 13px 'Inter',sans-serif; color:var(--taupe); margin-top:4px; }
  .ticket-divider{
    position:relative;
    border-top:2px dashed rgba(90,70,52,.28);
    margin:16px -22px;
  }
  .ticket-divider::before,.ticket-divider::after{
    content:''; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--ivory);
  }
  .ticket-divider::before{ left:-9px; }
  .ticket-divider::after{ right:-9px; }
  .ticket-actions{ display:flex; gap:10px; }
  .ticket-actions .btn{ flex:1; }
  .booked-pill{
    position:absolute; top:16px; right:18px;
    font:700 10px 'Inter',sans-serif; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); border:1px solid var(--gold); padding:4px 9px; border-radius:999px;
  }

  /* ---------- Chips / filters ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; margin-bottom:6px; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    padding:9px 16px;
    border-radius:999px;
    background:var(--sand);
    color:var(--espresso);
    font:600 12.5px 'Inter',sans-serif;
    white-space:nowrap;
    border:1px solid transparent;
    transition:background .2s, color .2s;
  }
  .chip.active{ background:var(--espresso); color:var(--ivory); }

  .day-strip{ display:flex; gap:10px; overflow-x:auto; padding:2px 0 14px; }
  .day-strip::-webkit-scrollbar{ display:none; }
  .day-pill{
    flex-shrink:0;
    width:56px;
    padding:10px 0;
    border-radius:16px;
    background:var(--sand);
    text-align:center;
    transition:background .2s,color .2s;
  }
  .day-pill .dname{ font:600 10.5px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.04em; color:var(--taupe); }
  .day-pill .dnum{ font-family:'Playfair Display',serif; font-weight:600; font-size:18px; margin-top:2px; color:var(--espresso); }
  .day-pill.active{ background:var(--charcoal); }
  .day-pill.active .dname{ color:var(--gold); }
  .day-pill.active .dnum{ color:var(--ivory); }

  /* ---------- Class list rows ---------- */
  .class-row{
    display:flex;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid rgba(90,70,52,.1);
    align-items:center;
  }
  .class-row:last-child{ border-bottom:none; }
  .class-time{ width:64px; flex-shrink:0; font:700 12.5px 'Inter',sans-serif; color:var(--espresso); line-height:1.3; }
  .class-time span{ display:block; font:400 11px 'Inter',sans-serif; color:var(--taupe); }
  .class-info{ flex:1; min-width:0; }
  .class-info .cname{ font-family:'Playfair Display',serif; font-weight:600; font-size:15.5px; color:var(--espresso); }
  .class-info .cmeta{ font:400 12.5px 'Inter',sans-serif; color:var(--taupe); margin-top:3px; }
  .spots-flag{ display:flex; align-items:center; gap:6px; font:600 11.5px 'Inter',sans-serif; flex-shrink:0; }
  .spots-dot{ width:7px; height:7px; border-radius:50%; }
  .dot-ok{ background:#7d9471; }
  .dot-low{ background:var(--gold); }
  .dot-full{ background:var(--terracotta); }

  .reschedule-banner{
    background:var(--charcoal); color:var(--ivory);
    border-radius:14px; padding:12px 16px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font:500 12.5px 'Inter',sans-serif;
  }
  .reschedule-banner .link-btn{ color:var(--gold); flex-shrink:0; }

  /* ---------- Home mini widgets ---------- */
  .card-strip{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(120deg,var(--charcoal),#453629);
    color:var(--ivory);
    border-radius:18px; padding:16px 18px; margin-bottom:22px;
  }
  .card-strip .cs-icon{ width:38px; height:38px; border-radius:10px; background:rgba(176,141,87,.22); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold); }
  .card-strip .cs-body{ flex:1; }
  .card-strip .cs-title{ font-family:'Playfair Display',serif; font-size:15px; font-weight:600; }
  .card-strip .cs-sub{ font:400 12px 'Inter',sans-serif; color:rgba(246,240,231,.65); margin-top:2px; }

  .promo-scroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 2px 16px; margin:0 -2px; }
  .promo-scroll::-webkit-scrollbar{ display:none; }
  .promo-card{
    flex-shrink:0; width:250px; border-radius:16px; padding:16px;
    background:linear-gradient(135deg,#d9825c,var(--terracotta));
    color:var(--ivory);
  }
  .promo-card .ptag{ font:700 10px 'Inter',sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:.85; }
  .promo-card .ptitle{ font-family:'Playfair Display',serif; font-weight:600; font-size:16px; margin:6px 0 4px; }
  .promo-card .pdesc{ font:400 12px 'Inter',sans-serif; line-height:1.4; opacity:.92; }

  .mini-scroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 2px 16px; margin:0 -2px; }
  .mini-scroll::-webkit-scrollbar{ display:none; }
  .mini-class{
    flex-shrink:0; width:168px; background:var(--sand); border-radius:16px; padding:14px;
  }
  .mini-class .mc-type{ font:700 10px 'Inter',sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); }
  .mini-class .mc-name{ font-family:'Playfair Display',serif; font-weight:600; font-size:15px; color:var(--espresso); margin:5px 0 3px; }
  .mini-class .mc-meta{ font:400 12px 'Inter',sans-serif; color:var(--taupe); }

  .quick-row{ display:flex; gap:10px; margin:4px 0 8px; }
  .quick-row .btn{ flex:1; }

  /* ---------- Membership card ---------- */
  .member-card-wrap{ perspective:1400px; margin-bottom:18px; }
  .member-card-inner{
    position:relative; width:100%; height:210px;
    transition:transform .65s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d; cursor:pointer;
  }
  .member-card-inner.flipped{ transform:rotateY(180deg); }
  .membership-card{
    position:absolute; inset:0;
    border-radius:20px;
    padding:22px 22px;
    background:linear-gradient(135deg,var(--charcoal) 0%,#4a3a2c 55%,var(--espresso) 100%);
    color:var(--ivory);
    overflow:hidden;
    box-shadow:0 22px 40px -14px rgba(46,38,32,.55);
    border:1px solid rgba(176,141,87,.4);
    backface-visibility:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .membership-card::after{
    content:''; position:absolute; top:0; left:-150%; width:55%; height:100%;
    background:linear-gradient(115deg, transparent 0%, rgba(246,240,231,.16) 45%, rgba(176,141,87,.55) 50%, rgba(246,240,231,.16) 55%, transparent 100%);
    transform:skewX(-20deg);
    animation:shine 6s ease-in-out infinite;
  }
  @keyframes shine{ 0%{left:-150%;} 55%{left:-150%;} 100%{left:150%;} }
  .mc-back{ transform:rotateY(180deg); align-items:center; justify-content:center; text-align:center; gap:14px; }
  .mc-top{ display:flex; align-items:center; justify-content:space-between; }
  .mc-brand{ font:700 11px 'Inter',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  .mc-tier{ font:600 10.5px 'Inter',sans-serif; letter-spacing:.05em; text-transform:uppercase; background:rgba(176,141,87,.22); color:var(--gold); padding:4px 10px; border-radius:999px; }
  .mc-name{ font-family:'Playfair Display',serif; font-weight:600; font-size:24px; margin-top:14px; }
  .mc-id{ font:400 12px 'Inter',sans-serif; color:rgba(246,240,231,.6); margin-top:3px; letter-spacing:.03em; }
  .mc-bottom{ display:flex; justify-content:space-between; align-items:flex-end; }
  .mc-field{ font:400 10.5px 'Inter',sans-serif; letter-spacing:.06em; text-transform:uppercase; color:rgba(246,240,231,.5); }
  .mc-field b{ display:block; font:600 13px 'Inter',sans-serif; color:var(--ivory); text-transform:none; letter-spacing:0; margin-top:2px; }
  .mc-hint{ font:400 11px 'Inter',sans-serif; color:rgba(246,240,231,.45); text-align:right; }
  .qr-grid{ width:120px; height:120px; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); gap:3px; background:var(--ivory); padding:10px; border-radius:10px; }
  .qr-grid div{ background:var(--charcoal); border-radius:1px; }
  .mc-back .mc-brand2{ font-family:'Playfair Display',serif; font-size:15px; color:var(--ivory); }
  .mc-back .mc-sub2{ font:400 11.5px 'Inter',sans-serif; color:rgba(246,240,231,.6); }

  .paused-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--sand); border:1px dashed var(--gold); border-radius:14px; padding:12px 16px; margin-bottom:16px;
    font:500 12.5px 'Inter',sans-serif; color:var(--espresso);
  }

  .plan-card{ background:var(--sand); border-radius:18px; padding:18px; margin-bottom:18px; }
  .plan-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .plan-row .pl-label{ font:600 14px 'Inter',sans-serif; color:var(--espresso); }
  .plan-row .pl-value{ font:400 13px 'Inter',sans-serif; color:var(--taupe); }
  .progress-track{ height:8px; background:rgba(90,70,52,.14); border-radius:999px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill{ height:100%; background:var(--terracotta); border-radius:999px; transition:width .4s ease; }
  .plan-caption{ font:400 12px 'Inter',sans-serif; color:var(--taupe); margin-bottom:14px; }

  .referral-card{ background:var(--sand); border-radius:18px; padding:18px; margin-bottom:14px; }
  .referral-code{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ivory); border:1.5px dashed var(--taupe); border-radius:12px; padding:12px 14px; margin-top:12px;
  }
  .referral-code span{ font:700 16px 'Inter',sans-serif; letter-spacing:.08em; color:var(--espresso); }

  /* ---------- Profile ---------- */
  .profile-top{ display:flex; align-items:center; gap:14px; margin:6px 0 20px; }
  .avatar{
    width:60px; height:60px; border-radius:50%;
    background:linear-gradient(135deg,var(--gold),#c9a874);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display',serif; font-weight:600; font-size:22px; color:var(--ivory);
    flex-shrink:0;
  }
  .profile-name{ font-family:'Playfair Display',serif; font-weight:600; font-size:19px; color:var(--espresso); }
  .profile-email{ font:400 13px 'Inter',sans-serif; color:var(--taupe); margin-top:2px; }

  .menu-list{ background:var(--sand); border-radius:18px; overflow:hidden; margin-bottom:16px; }
  .menu-row{
    display:flex; align-items:center; gap:14px; padding:15px 16px;
    border-bottom:1px solid rgba(90,70,52,.08);
  }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row .mr-icon{ width:34px; height:34px; border-radius:9px; background:rgba(90,70,52,.08); display:flex; align-items:center; justify-content:center; color:var(--espresso); flex-shrink:0; }
  .menu-row .mr-label{ flex:1; font:600 14.5px 'Inter',sans-serif; color:var(--espresso); }
  .menu-row.danger .mr-label{ color:var(--terracotta); }
  .menu-row.danger .mr-icon{ color:var(--terracotta); background:rgba(196,106,69,.1); }

  /* ---------- Forms ---------- */
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font:600 12px 'Inter',sans-serif; color:var(--espresso); letter-spacing:.01em; }
  .field input,.field select,.field textarea{
    font:15px 'Inter',sans-serif; padding:13px 14px; border-radius:12px;
    border:1.5px solid rgba(90,70,52,.18); background:var(--sand); color:var(--espresso);
    outline:none; transition:border-color .2s;
  }
  .field input::placeholder,.field textarea::placeholder{ color:rgba(90,70,52,.4); }
  .field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--terracotta); }
  .field textarea{ resize:vertical; min-height:90px; font-family:'Inter',sans-serif; }
  .field-note{ font:400 12px 'Inter',sans-serif; color:var(--taupe); }
  .form-foot-link{ text-align:center; font:400 13px 'Inter',sans-serif; color:var(--taupe); margin-top:18px; }

  /* ---------- Switch ---------- */
  .switch-row{ display:flex; align-items:center; justify-content:space-between; padding:15px 16px; border-bottom:1px solid rgba(90,70,52,.08); background:var(--sand); }
  .switch-row:first-child{ border-radius:18px 18px 0 0; }
  .switch-row:last-child{ border-bottom:none; border-radius:0 0 18px 18px; }
  .switch-label{ font:600 14px 'Inter',sans-serif; color:var(--espresso); }
  .switch-desc{ font:400 12px 'Inter',sans-serif; color:var(--taupe); margin-top:2px; }
  .switch{ width:46px; height:26px; border-radius:999px; background:rgba(90,70,52,.22); position:relative; transition:.2s; flex-shrink:0; }
  .switch.on{ background:var(--terracotta); }
  .switch-knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--ivory); transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .switch.on .switch-knob{ left:23px; }

  /* ---------- Accordion ---------- */
  .accordion-item{ border-bottom:1px solid rgba(90,70,52,.12); }
  .accordion-item:first-child{ border-top:1px solid rgba(90,70,52,.12); }
  .accordion-q{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 0; font:600 14.5px 'Inter',sans-serif; color:var(--espresso); }
  .accordion-q svg{ flex-shrink:0; transition:transform .25s ease; color:var(--taupe); }
  .accordion-item.open .accordion-q svg{ transform:rotate(180deg); }
  .accordion-a{ max-height:0; overflow:hidden; transition:max-height .3s ease; }

/* =========================================================

   ========================================================= */
function generateSchedule(){
  const today = new Date();
  const days = [];
  for(let d=0; d<7; d++){
    const dt = new Date(today);
    dt.setDate(today.getDate()+d);
    days.push(dt);
  }
  state.days = days;

  const classes = [];
  days.forEach((date,d)=>{
    const slots = d===6 ? TIMES.slice(0,4) : TIMES;
    slots.forEach((time,t)=>{
      const tmpl = CLASS_TEMPLATES[(d+t)%CLASS_TEMPLATES.length];
      const spotsTotal = tmpl.type==='Reformer' ? 10 : 16;
      const used = (d*13 + t*7) % (spotsTotal+4);
      const spotsLeft = Math.max(0, spotsTotal-used);
      classes.push({ id:`d${d}t${t}`, dayIndex:d, date, time, spotsTotal, spotsLeft, ...tmpl });
    });
  });
  state.classes = classes;
}

function generateBookings(){
  const c1 = state.classes.find(c=>c.id==='d0t3');
  const c2 = state.classes.find(c=>c.id==='d2t1');
  if(c1) c1.spotsLeft = Math.max(0, c1.spotsLeft-1);
  if(c2) c2.spotsLeft = Math.max(0, c2.spotsLeft-1);
  state.bookings = [
    { id:'bk1', status:'upcoming', classId:c1 ? c1.id : null },
    { id:'bk2', status:'upcoming', classId:c2 ? c2.id : null },
    { id:'bk3', status:'past', pastInfo:{ name:'Mat Foundations', type:'Mat', instructor:'Jordan Blake', time:'8:15 AM', dateLabel:'Jul 10', duration:45 } },
    { id:'bk4', status:'past', pastInfo:{ name:'Reformer Flow', type:'Reformer', instructor:'Priya Nair', time:'6:45 PM', dateLabel:'Jul 6', duration:50 } },
    { id:'bk5', status:'past', pastInfo:{ name:'Recovery Stretch', type:'Recovery', instructor:'Liv Andersen', time:'12:15 PM', dateLabel:'Jun 29', duration:40 } },
  ].filter(b=> b.status!=='upcoming' || b.classId);
}

function dayLabel(date, index){
  if(index===0) return 'Today';
  if(index===1) return 'Tomorrow';
  return date.toLocaleDateString('en-AU',{ weekday:'short' });
}
function fullDateLabel(date){
  return date.toLocaleDateString('en-AU',{ weekday:'short', day:'numeric', month:'short' });
}
function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 18) return 'Good afternoon';
  return 'Good evening';
}
function firstName(){ return state.user.name.split(' ')[0]; }
function initials(name){ return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }
function unreadCount(){ return state.notifications.filter(n=>!n.read).length; }

function pastBookings(){ return state.bookings.filter(b=>b.status==='past'); }
function spotsClass(c){ if(c.spotsLeft<=0) return 'dot-full'; if(c.spotsLeft<=3) return 'dot-low'; return 'dot-ok'; }
function spotsText(c){ if(c.spotsLeft<=0) return 'Full'; if(c.spotsLeft<=3) return `${c.spotsLeft} left`; return 'Open'; }
function qrCells(){
  let out='';
  for(let i=0;i<64;i++){ out += `<div style="opacity:${ (i*17+7)%5===0 ? 0 : 1 }"></div>`; }

  if(dot) dot.style.display = unreadCount()>0 ? 'block' : 'none';
}
function renderNotifPanel(){
  document.getElementById('notif-panel').innerHTML = `
    <div class="notif-head">
      <div class="header-title" style="font-size:18px;">Notifications</div>
      <div style="display:flex;gap:16px;align-items:center;">
        <button class="link-btn" onclick="markAllRead()">Mark all read</button>
        <button class="icon-btn" onclick="toggleNotifPanel()">${ICONS.close}</button>
      </div>
    </div>
    <div class="notif-list">
      ${state.notifications.map(n=>`
        <div class="notif-item ${n.read?'':'unread'}" onclick="readNotif('${n.id}')">
          <div class="notif-icon">${ICONS[n.icon] || ICONS.bell}</div>
          <div class="notif-body">
            <div class="notif-title">${n.title}</div>
            <div class="notif-text">${n.text}</div>
            <div class="notif-time">${n.time}</div>
          </div>
          ${n.read ? '' : '<span class="dot"></span>'}
        </div>
      `).join('')}
    </div>
  `;
}

/* =========================================================
   HEADER
   ========================================================= */
function header({ title, eyebrow, sub, showBack, showBell }={}){
  return `
    <div class="app-header">
      <div class="header-left">
        ${showBack ? `<button class="icon-btn" onclick="${showBack}">${ICONS.back}</button>` : ''}
        <div>
          ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
          <div class="header-title">${title}</div>
          ${sub ? `<div class="header-sub">${sub}</div>` : ''}
        </div>
      </div>
      ${showBell ? `
        <button class="icon-btn" onclick="toggleNotifPanel()">
          ${ICONS.bell}
          <span class="dot header-bell-dot" style="display:${unreadCount()>0?'block':'none'}"></span>
        </button>` : `<div style="width:38px"></div>`}
    </div>
  `;
}

}

/* =========================================================
   SCREENS \u2014 CLASSES
   ========================================================= */
function renderClasses(){
  const filters = ['All','Reformer','Mat','Barre','Recovery'];
  const dayClasses = state.classes
    .filter(c=>c.dayIndex===state.selectedDayIndex)
    .filter(c=> state.filter==='All' || c.type===state.filter)
    .sort((a,b)=> TIMES.indexOf(a.time)-TIMES.indexOf(b.time));

  return `
    ${header({ title:'Studio Sessions', eyebrow:'BOOK A CLASS', showBell:true })}

    ${state.rescheduleTarget ? `
      <div class="reschedule-banner">
        <span>Choose a new session for your booking</span>
        <a class="link-btn" onclick="cancelReschedule()">Cancel</a>
      </div>
    ` : ''}

    <div class="day-strip">
      ${state.days.map((d,i)=>`
        <div class="day-pill ${i===state.selectedDayIndex?'active':''}" onclick="setDay(${i})">
          <div class="dname">${dayLabel(d,i)}</div>
          <div class="dnum">${d.getDate()}</div>
        </div>
      `).join('')}
    </div>

    <div class="chip-row">
      ${filters.map(f=>`<button class="chip ${state.filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}
    </div>

    <div class="card" style="padding:6px 18px;">
      ${dayClasses.length ? dayClasses.map(c=>{
        const booked = upcomingBookings().some(b=> b.classId===c.id);
        return `
        <div class="class-row" onclick="openClassDetail('${c.id}')">
          <div class="class-time">${c.time.split(' ')[0]}<span>${c.time.split(' ')[1]}</span></div>
          <div class="class-info">
            <div class="cname">${c.name}${booked ? ' \u2014 Booked' : ''}</div>
            <div class="cmeta">${c.instructor} \u00b7 ${c.duration} min \u00b7 ${c.level}</div>
          </div>
          <div class="spots-flag">
            <span class="spots-dot ${spotsClass(c)}"></span>
            ${spotsText(c)}
          </div>
        </div>`;
      }).join('') : `
        <div class="empty-state">
          ${ICONS.calendar}
          <p>No ${state.filter==='All'?'':state.filter+' '}sessions on this day.</p>
        </div>
      `}
    </div>
  `;
}

function setDay(i){ state.selectedDayIndex=i; render(); }
function setFilter(f){ state.filter=f; render(); }

function openClassDetail(id){
  const c = state.classes.find(x=>x.id===id);
  if(!c) return;
  const booking = upcomingBookings().find(b=> b.classId===c.id);
  const full = c.spotsLeft<=0;

  let actionHtml = '';
  if(state.rescheduleTarget){
    actionHtml = `<button class="btn btn-primary btn-block" onclick="doReschedule('${c.id}')">Move booking here</button>`;
  } else if(booking){
    actionHtml = `
      <div class="sheet-actions">
        <button class="btn btn-ghost btn-block" onclick="closeModal(); startReschedule('${booking.id}')">Reschedule</button>
        <button class="btn btn-danger-ghost btn-block" onclick="closeModal(); cancelBooking('${booking.id}')">Cancel booking</button>
      </div>
    `;
  } else if(full){
    actionHtml = `<button class="btn btn-dark btn-block" onclick="joinWaitlist('${c.id}')">Join waitlist</button>`;
  } else {
    actionHtml = `<button class="btn btn-primary btn-block" onclick="confirmBook('${c.id}')">Book this class</button>`;
  }

  openModal(`
    <span class="ticket-tag">${c.type}</span>
    <div class="sheet-title">${c.name}</div>
    <div class="sheet-sub">${dayLabel(c.date,c.dayIndex)}, ${fullDateLabel(c.date)} \u00b7 ${c.time} \u00b7 ${c.duration} min</div>
    <div class="option-list" style="margin-bottom:18px;">
      <div class="menu-row"><div class="mr-icon">${ICONS.profile}</div><div class="mr-label">Instructor<br><b style="font-weight:600;color:var(--espresso)">${c.instructor}</b></div></div>
      <div class="menu-row"><div class="mr-icon">${ICONS.spark}</div><div class="mr-label">Level<br><b style="font-weight:600;color:var(--espresso)">${c.level}</b></div></div>
      <div class="menu-row"><div class="mr-icon">${ICONS.classes}</div><div class="mr-label">Availability<br><b style="font-weight:600;color:var(--espresso)">${spotsText(c)} of ${c.spotsTotal} spots</b></div></div>
    </div>
    ${actionHtml}
  `);
}

function confirmBook(id){
  const c = state.classes.find(x=>x.id===id);
  if(!c) return;
  c.spotsLeft = Math.max(0, c.spotsLeft-1);
  state.bookings.unshift({ id:'bk'+Date.now(), status:'upcoming', classId:c.id });
  closeModal(); render();
  toast(`Booking confirmed \u00b7 ${c.name} at ${c.time}`);
}
function joinWaitlist(id){
  closeModal();
  toast('Added to the waitlist \u2014 we\u2019ll notify you of an opening');
}

/* =========================================================
   SCREENS \u2014 BOOKINGS
   ========================================================= */
function renderBookings(){
  const view = state.bookingsView;
  return `
    ${header({ title:'My Bookings', eyebrow:'MANAGE', showBell:true })}

    <div class="chip-row">
      <button class="chip ${view==='upcoming'?'active':''}" onclick="setBookingsView('upcoming')">Upcoming</button>
      <button class="chip ${view==='past'?'active':''}" onclick="setBookingsView('past')">Past</button>
    </div>

    ${view==='upcoming' ? renderUpcomingBookings() : renderPastBookings()}
  `;
}
function setBookingsView(v){ state.bookingsView=v; render(); }

function renderUpcomingBookings(){
  const list = upcomingBookings().map(b=>({b,c:getBookingInfo(b)})).filter(x=>x.c)
    .sort((a,b)=> a.c.dayIndex-b.c.dayIndex);
  if(!list.length){
    return `<div class="card empty-state">${ICONS.bookings}<div style="font-family:'Playfair Display',serif;font-size:16px;color:var(--espresso);">Nothing booked yet</div><p>Your upcoming sessions will show up here.</p><button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="goTab('classes')">Browse classes</button></div>`;
  }
  return list.map(({b,c})=>`
    <div class="ticket-card">
      <span class="ticket-tag">${c.type}</span>
      <div class="ticket-name">${c.name}</div>
      <div class="ticket-meta">${dayLabel(c.date,c.dayIndex)}, ${fullDateLabel(c.date)} \u00b7 ${c.time}</div>
      <div class="ticket-meta">${c.instructor} \u00b7 Sora House Studio, Paddington</div>
      <div class="ticket-divider"></div>
      <div class="ticket-actions">
        <button class="btn btn-ghost btn-sm" onclick="startReschedule('${b.id}')">Reschedule</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="cancelBooking('${b.id}')">Cancel</button>
      </div>
    </div>
  `).join('');
}
function renderPastBookings(){
  const list = pastBookings();
  if(!list.length){
    return `<div class="card empty-state">${ICONS.bookings}<p>No past sessions yet.</p></div>`;
  }
  return `<div class="card" style="padding:6px 18px;">
    ${list.map(b=>{ const c=b.pastInfo; return `
      <div class="class-row">
        <div class="class-time">${c.dateLabel}<span>${c.time}</span></div>
        <div class="class-info">
          <div class="cname">${c.name}</div>
          <div class="cmeta">${c.instructor} \u00b7 ${c.duration} min</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="bookAgain()">Book again</button>
      </div>
    `; }).join('')}
  </div>`;
}

function startReschedule(bkId){
  state.rescheduleTarget = bkId;
  goTab('classes');
  toast('Pick a new session for your booking');
}
function cancelReschedule(){ state.rescheduleTarget=null; render(); }
function doReschedule(newClassId){
  const bk = state.bookings.find(b=>b.id===state.rescheduleTarget);
  if(bk){
    const oldClass = state.classes.find(c=>c.id===bk.classId);
    if(oldClass) oldClass.spotsLeft++;
    const newClass = state.classes.find(c=>c.id===newClassId);
    if(newClass) newClass.spotsLeft = Math.max(0,newClass.spotsLeft-1);
    bk.classId = newClassId;
  }
  state.rescheduleTarget=null;
  closeModal();
  goTab('bookings');
  toast('Booking rescheduled');
}
function cancelBooking(bkId){
  const bk = state.bookings.find(b=>b.id===bkId);
  const c = bk ? getBookingInfo(bk) : null;
  openModal(`
    <div class="sheet-title">Cancel this booking?</div>
    <div class="sheet-sub">${c ? `${c.name} \u00b7 ${c.time}` : 'This session'} will be removed from your bookings. Cancellations within 12 hours may use a credit.</div>
    <div class="sheet-actions">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Keep booking</button>
      <button class="btn btn-primary btn-block" onclick="doCancelBooking('${bkId}')">Cancel session</button>
    </div>
  `);
}
function doCancelBooking(bkId){
  const bk = state.bookings.find(b=>b.id===bkId);
  if(bk){
    bk.status='cancelled';
    const c = state.classes.find(x=>x.id===bk.classId);
    if(c) c.spotsLeft++;
  }
  closeModal(); render();
  toast('Booking cancelled');
}
function bookAgain(){ goTab('classes'); toast('Browse sessions to book again'); }

      <div class="plan-row"><span class="pl-label">${state.user.tier}</span><span class="pl-value">${state.user.renewalDate}</span></div>

        <span>${state.user.referralCode}</span>
        <button class="btn btn-ghost btn-sm" onclick="toast('Referral code copied!')">Copy</button>
      </div>
    </div>
    <button class="link-btn" style="display:block;text-align:center;margin:4px auto 8px;" onclick="goSub('promotions')">See all offers</button>

function flipCard(){
  const el = document.getElementById('member-card-inner');
  if(el){ el.classList.toggle('flipped'); state.cardFlipped = el.classList.contains('flipped'); }
}
function openManagePlan(){
  openModal(`
    <div class="sheet-title">Manage plan</div>
    <div class="sheet-sub">Make changes to your Sora House membership.</div>
    <div class="option-list">
      <div class="menu-row" onclick="planAction('pause')"><div class="mr-icon">${ICONS.calendar}</div><div class="mr-label">${state.user.paused?'Resume membership':'Pause membership'}</div>${ICONS.chevron}</div>
      <div class="menu-row" onclick="planAction('upgrade')"><div class="mr-icon">${ICONS.spark}</div><div class="mr-label">Upgrade plan</div>${ICONS.chevron}</div>
      <div class="menu-row danger" onclick="planAction('cancel')"><div class="mr-icon">${ICONS.close}</div><div class="mr-label">Cancel membership</div>${ICONS.chevron}</div>
    </div>
  `);
}
function planAction(action){
  if(action==='pause'){
    state.user.paused = !state.user.paused;
    closeModal(); render();
    toast(state.user.paused ? 'Membership paused until your next billing date' : 'Membership resumed');
  } else if(action==='upgrade'){
    closeModal();
    toast('Upgrade options aren\u2019t available in this prototype');
  } else if(action==='cancel'){
    openModal(`
      <div class="sheet-title">Cancel membership?</div>
      <div class="sheet-sub">You\u2019ll keep access until ${state.user.renewalDate}. This won\u2019t cancel any bookings already made.</div>
      <div class="sheet-actions">
        <button class="btn btn-outline btn-block" onclick="closeModal()">Keep membership</button>
        <button class="btn btn-primary btn-block" onclick="doCancelMembership()">Cancel plan</button>
      </div>
    `);
  }
}
function doCancelMembership(){
  closeModal();
  toast('Cancellation scheduled for the end of your billing period');
}

    </div>
    <div class="menu-list">
      <div class="menu-row" onclick="goSub('faqs')"><div class="mr-icon">${ICONS.faq}</div><div class="mr-label">FAQs</div>${ICONS.chevron}</div>
      <div class="menu-row" onclick="goSub('contact')"><div class="mr-icon">${ICONS.chat}</div><div class="mr-label">Contact support</div>${ICONS.chevron}</div>
    </div>
    <div class="menu-list">
      <div class="menu-row danger" onclick="requestLogout()"><div class="mr-icon">${ICONS.logout}</div><div class="mr-label">Log out</div></div>
    </div>
  `;
}

/* ---- Personal details ---- */
function renderPersonal(){
  return `
    ${header({ title:'Personal details', eyebrow:'PROFILE', showBack:'goBackSub()' })}
    <form onsubmit="savePersonal(event)">
      <div class="field"><label for="pd-name">Full name</label><input id="pd-name" type="text" value="${state.user.name}"></div>
      <div class="field"><label for="pd-email">Email</label><input id="pd-email" type="email" value="${state.user.email}"></div>
      <div class="field"><label for="pd-phone">Phone</label><input id="pd-phone" type="tel" value="${state.user.phone}"></div>
      <button type="submit" class="btn btn-primary btn-block">Save changes</button>
    </form>
  `;
}
function savePersonal(e){
  e.preventDefault();
  const name = document.getElementById('pd-name').value.trim();
  const email = document.getElementById('pd-email').value.trim();
  const phone = document.getElementById('pd-phone').value.trim();
  if(!name || !email){ shakeField(!name?'pd-name':'pd-email'); return; }
  state.user.name = name; state.user.email = email; state.user.phone = phone;
  toast('Profile updated');
  goBackSub();
}

/* ---- Payment methods ---- */
function renderPayment(){
  return `
    ${header({ title:'Payment methods', eyebrow:'BILLING', showBack:'goBackSub()' })}
    <div class="card-strip" style="background:linear-gradient(135deg,var(--charcoal),#4a3a2c);">
      <div class="cs-icon">${ICONS.card}</div>
      <div class="cs-body">
        <div class="cs-title">Visa \u2022\u2022\u2022\u2022 4242</div>
        <div class="cs-sub">Expires 09/28 \u00b7 Default</div>
      </div>
    </div>
    <button class="btn btn-outline btn-block" onclick="toast('Prototype only \u2014 payment isn\u2019t processed')">Add payment method</button>
  `;
}

/* ---- Notification settings ---- */
function renderNotifSettings(){
  const items = [
    { key:'classReminders', label:'Class reminders', desc:'Alerts before your booked sessions' },
    { key:'promotions', label:'Promotions & offers', desc:'New offers and referral rewards' },
    { key:'waitlist', label:'Waitlist openings', desc:'When a spot opens in a full class' },
    { key:'studioNews', label:'Studio news', desc:'Updates from Sora House' },
  ];
  return `
    ${header({ title:'Notifications', eyebrow:'PREFERENCES', showBack:'goBackSub()' })}
    <div>
      ${items.map(it=>`
        <div class="switch-row">
          <div>
            <div class="switch-label">${it.label}</div>
            <div class="switch-desc">${it.desc}</div>
          </div>
          <div class="switch ${state.user.notifPrefs[it.key]?'on':''}" onclick="toggleSwitch(this,'${it.key}')"><div class="switch-knob"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}
function toggleSwitch(el, key){
  el.classList.toggle('on');
  state.user.notifPrefs[key] = el.classList.contains('on');
}

/* ---- FAQs ---- */
function renderFaqs(){
  return `
    ${header({ title:'FAQs', eyebrow:'SUPPORT', showBack:'goBackSub()' })}
    <div>
      ${FAQS.map((f,i)=>`
        <div class="accordion-item" id="faq-${i}">
          <div class="accordion-q" onclick="toggleFaq(${i})"><span>${f.q}</span>${ICONS.chevron}</div>
          <div class="accordion-a"><p>${f.a}</p></div>
        </div>
      `).join('')}
    </div>
  `;
}
function toggleFaq(i){
  const el = document.getElementById('faq-'+i);
  if(el) el.classList.toggle('open');
}

/* ---- Contact support ---- */
function renderContact(){
  return `
    ${header({ title:'Contact support', eyebrow:'WE\u2019RE HERE TO HELP', showBack:'goBackSub()' })}
    <p class="auth-lede">Send us a message and our studio team will get back to you within 24 hours.</p>
    <form onsubmit="submitSupport(event)">
      <div class="field">
        <label for="cs-subject">Subject</label>
        <select id="cs-subject">
          <option>Booking issue</option>
          <option>Membership question</option>
          <option>Studio feedback</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="cs-message">Message</label>
        <textarea id="cs-message" placeholder="How can we help?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send message</button>
    </form>
  `;
}
function submitSupport(e){
  e.preventDefault();
  const msg = document.getElementById('cs-message').value.trim();
  if(!msg){ shakeField('cs-message'); return; }
  e.target.reset();
  toast('Message sent \u2014 we\u2019ll reply within 24 hours');
  goBackSub();
}

/* ---- Promotions ---- */
function renderPromotions(){
  return `
    ${header({ title:'Promotions', eyebrow:'OFFERS FOR YOU', showBack:'goBackSub()' })}
    ${PROMOTIONS.map(p=>`
      <div class="card">
        <span class="ticket-tag">${p.tag}</span>
        <div style="font-family:'Playfair Display',serif;font-weight:600;font-size:17px;color:var(--espresso);margin-bottom:6px;">${p.title}</div>
        <div style="font:400 13.5px 'Inter',sans-serif;color:var(--taupe);line-height:1.55;">${p.desc}</div>
      </div>
    `).join('')}
    <div class="referral-card">
      <div style="font:600 14px 'Inter',sans-serif;color:var(--espresso);">Your referral code</div>
      <div class="referral-code">
        <span>${state.user.referralCode}</span>
        <button class="btn btn-ghost btn-sm" onclick="toast('Referral code copied!')">Copy</button>
      </div>
    </div>
  `;
}

/* =========================================================
   MASTER RENDER
   ========================================================= */
function renderTabBar(){
  const tabs = [
    { key:'home', label:'Home', icon:'home' },
    { key:'classes', label:'Classes', icon:'classes' },
    { key:'bookings', label:'Bookings', icon:'bookings' },
    { key:'membership', label:'Card', icon:'membership' },
    { key:'profile', label:'Profile', icon:'profile' },
  ];
  document.getElementById('tab-bar').innerHTML = tabs.map(t=>`
    <div class="tab-item ${state.tab===t.key && !state.subScreen ? 'active':''}" onclick="goTab('${t.key}')">
      ${ICONS[t.icon]}
      <span>${t.label}</span>
    </div>
  `).join('');
}

function renderMain(){
  if(state.subScreen){
    switch(state.subScreen){
      case 'personal': return renderPersonal();
      case 'payment': return renderPayment();
      case 'notifsettings': return renderNotifSettings();
      case 'faqs': return renderFaqs();
      case 'contact': return renderContact();
      case 'promotions': return renderPromotions();
      default: return renderProfile();
    }
  }
  switch(state.tab){
    case 'home': return renderHome();
    case 'classes': return renderClasses();
    case 'bookings': return renderBookings();
    case 'membership': return renderMembership();
    case 'profile': return renderProfile();
    default: return renderHome();
  }
}

function render(){
  const el = document.getElementById('screen-content');
  let html = '';
  if(state.screen==='splash') html = renderSplash();
  else if(state.screen==='login') html = renderLogin();
  else if(state.screen==='signup') html = renderSignup();
  else html = renderMain();

  el.innerHTML = html;
  document.getElementById('tab-bar').style.display = state.screen==='main' ? 'flex' : 'none';
  if(state.screen==='main') renderTabBar();

  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
  el.scrollTop = 0;
}

/* =========================================================
   INIT
   ========================================================= */
generateSchedule();
generateBookings();
renderNotifPanel();
render();
</script>
</body>
</html>
